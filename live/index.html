<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live manifest, Brazil Boogie</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Today's loads, weather and meeting point for Brazil Boogie.">
<meta property="og:title" content="Live manifest, Brazil Boogie">
<meta property="og:description" content="Today's loads, weather and meeting point. Check here before you head to the beach.">
<meta property="og:image" content="https://brazilboogie.com/images/og/share.jpg">
<meta property="og:url" content="https://brazilboogie.com/live/">
<meta name="theme-color" content="#0c3d5c">
<link rel="icon" href="../images/og/favicon.png" sizes="any">
<link rel="apple-touch-icon" href="../images/og/favicon.png">
<style>
/* Partiful event-page layout (gradient, frosted pills, avatar stack, glass panels) with Flighty's system font */
:root{--pill:rgba(255,255,255,.12);--glass:rgba(0,0,0,.28);--soft:rgba(255,255,255,.72);--faint:rgba(255,255,255,.55)}
*{box-sizing:border-box}
html{background:#0c3d5c}
body{margin:0;min-height:100vh;color:#fff;font:400 16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
  background:linear-gradient(180deg,#0c3d5c 0%,#11658a 30%,#1b8fa8 55%,#5aa9a6 75%,#d9a46b 100%) fixed}
.wrap{max-width:480px;margin:0 auto;padding:14px 18px 50px}
.bar{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:700;font-size:20px;letter-spacing:-.02em}
.p{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 15px;border-radius:800px;font-weight:600;font-size:14px;text-decoration:none;color:#fff}
.p.frost{background:var(--pill);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,.18)}
.p.white{background:#fff;color:#000}
.live:before{content:'';width:8px;height:8px;border-radius:50%;background:#ff4d4d;animation:b 1.4s infinite}
@keyframes b{50%{opacity:.25}}
.head{text-align:center;margin:26px 0 18px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--soft)}
.head h1{font-size:40px;font-weight:700;letter-spacing:-.025em;margin:6px 0 0}
.stat{padding:20px 20px 18px}
.stat .lab{font-size:11px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--soft)}
.stat .big{display:flex;align-items:center;gap:12px;font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:8px 0 8px}
.pulse{flex:none;width:14px;height:14px;border-radius:50%;background:#3ddc84;animation:pu 2s infinite}
.pulse.hold,.pulse.delayed{background:#ffc700}.pulse.cancelled{background:#ff5a5f}.pulse.done{background:#ccc;animation:none}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}70%{box-shadow:0 0 0 12px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.stat .u{font-size:14px;color:var(--soft)}
.stat .note{margin:4px 0 6px;color:#fff}
h1{font-weight:700;font-size:44px;line-height:1.02;letter-spacing:-.025em;margin:28px 0 6px}
.note{color:var(--soft);font-size:16px;margin-bottom:6px}
h2{font-weight:600;font-size:22px;letter-spacing:-.01em;margin:30px 0 4px}
.sub{color:var(--soft);font-size:14px;margin-bottom:12px}
.ld{padding:14px 0;border-top:1px solid rgba(255,255,255,.14)}
.ld .r{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ld .meet{font-weight:700;font-size:21px;line-height:1.2;letter-spacing:-.01em}
.ld .tk{color:var(--faint);font-size:14px;margin-top:2px}
.ld .p{height:28px;font-size:12px;padding:0 11px;flex:none}
.ld .p.meetnow{background:#fff;color:#000}.ld .p.air{background:#000;border-color:#000}
.av{display:flex;align-items:center;margin-top:10px}
.av span{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;margin-right:-8px;border:2px solid rgba(255,255,255,.9);color:#fff}
.av em{font-style:normal;margin-left:18px;font-size:15px;color:var(--soft)}
.ld.done{opacity:.4}
.fuel{padding:10px 0;border-top:1px solid rgba(255,255,255,.14);color:var(--faint);font-size:14px}
.glass{background:var(--glass);border-radius:16px;overflow:hidden;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.glass iframe{display:block;width:100%;height:230px;border:0}
.glass .in{padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.glass b{display:block;font-weight:600}.glass .in span{color:var(--soft);font-size:14px}
.wx{display:flex;justify-content:space-around;padding:18px 8px 6px;text-align:center}
.wx b{font-size:28px;font-weight:600}.wx span{display:block;font-size:12px;color:var(--soft)}
.hrs{display:flex;padding:8px 6px 14px;text-align:center}
.hrs div{flex:1;font-weight:600;font-size:14px}.hrs i{display:block;font-style:normal;font-weight:400;font-size:12px;color:var(--faint)}
</style></head><body>
<div class="wrap" id="app"></div>
<script>
// Shared data + logic for the live manifest design options. Each page defines render(view).
const TZ = 'America/Sao_Paulo', LAT = -22.79, LON = -41.93;
const STATUS = 'status.json';
const HEAD = {on:'On schedule', hold:'Weather hold', delayed:'Running late', cancelled:'Jumping cancelled', done:'Done for the day'};
const MAP_EMBED = 'https://maps.google.com/maps?q=Restaurante%20Mergulhador%2C%20Praia%20Tucuns%2C%20B%C3%BAzios&z=15&output=embed';
let DATA = null, WX = null;

function nowBRT(){
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return {date:`${p.year}-${p.month}-${p.day}`, mins:(+p.hour%24)*60 + +p.minute};
}
const toMins = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
function fmt(t){ let [h,m] = t.split(':').map(Number); const ap = h>=12?'pm':'am'; h = h%12||12; return `${h}:${String(m).padStart(2,'0')}${ap}`; }
function ago(iso){
  const s = Math.max(0,(Date.now()-new Date(iso))/1000);
  if (s<90) return 'just now';
  if (s<3600) return Math.round(s/60)+' min ago';
  const h = Math.floor(s/3600); return h+' hr'+(h>1?'s':'')+' ago';
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function loadState(l){
  if (l.state) return l.state;
  const now = nowBRT(), st = DATA.status;
  if (now.date > DATA.date) return 'done';
  const today = now.date === DATA.date, t = toMins(l.time), meet = toMins(l.meet || l.time);
  if (today && now.mins >= t + 15) return 'done';
  if (st === 'cancelled') return 'cancelled';
  if (st === 'hold') return 'hold';
  if (!today) return 'upcoming';
  if (now.mins >= t) return 'air';
  if (now.mins >= meet) return 'meet';
  return 'upcoming';
}
const LABEL = {upcoming:'Upcoming', meet:'Head to the beach', air:'In the air', done:'Done', hold:'On hold', delayed:'Delayed', cancelled:'Cancelled'};

// time left until the meet time, as {big, small}, e.g. {big:'45', small:'MINUTES'} or {big:'9h', small:'50 MIN'}
function untilMeet(l){
  const now = nowBRT();
  const dayDiff = Math.round((new Date(DATA.date) - new Date(now.date)) / 86400000);
  const m = dayDiff * 1440 + toMins(l.meet || l.time) - now.mins;
  if (m <= 0) return null;
  if (m < 60) return {big: String(m), small: 'MIN'};
  const h = Math.floor(m / 60), r = m % 60;
  return {big: h + 'h', small: r + ' MIN'};
}
function view(){
  const st = DATA.status || 'on';
  let open = true;
  const items = (DATA.items||[]).map(it => {
    if (it.type !== 'load') return it;
    const s = loadState(it), current = s !== 'done' && open; if (current) open = false;
    return {...it, s, label: LABEL[s] || s, current, until: untilMeet(it)};
  });
  return {st, headline: DATA.headline || HEAD[st], note: DATA.note || '', updated: 'Last updated ' + ago(DATA.updated),
          items, meet: DATA.meet_point, map: MAP_EMBED, wx: WX};
}
async function loadStatus(){
  try { DATA = await (await fetch(STATUS + '?t=' + Date.now(), {cache:'no-store'})).json(); } catch(e) {}
  if (DATA) render(view());
}
async function loadWeather(){
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=wind_speed_10m,wind_gusts_10m,wind_direction_10m,cloud_cover,temperature_2m&hourly=wind_speed_10m,wind_gusts_10m,precipitation_probability&wind_speed_unit=kn&timezone=${encodeURIComponent(TZ)}&forecast_days=2`;
    const w = await (await fetch(u)).json(), c = w.current, now = nowBRT();
    const dirs = ['N','NE','E','SE','S','SW','W','NW'];
    const ahead = DATA && now.date < DATA.date;
    const from = ahead ? DATA.date + 'T07' : c.time.slice(0,13);
    const i0 = Math.max(0, w.hourly.time.findIndex(t => t >= from));
    const hours = [];
    for (let i = i0; i < i0 + 6 && i < w.hourly.time.length; i++) {
      const hr = +w.hourly.time[i].slice(11,13);
      hours.push({h:(hr%12||12)+(hr>=12?'pm':'am'), wind:Math.round(w.hourly.wind_speed_10m[i]), gust:Math.round(w.hourly.wind_gusts_10m[i]), rain:w.hourly.precipitation_probability[i] ?? 0});
    }
    WX = {wind:Math.round(c.wind_speed_10m), dir:dirs[Math.round(c.wind_direction_10m/45)%8], gust:Math.round(c.wind_gusts_10m),
          cloud:Math.round(c.cloud_cover), temp:Math.round(c.temperature_2m), hours, hoursLabel: ahead ? 'During the loads' : 'Next few hours'};
  } catch(e) {}
  if (DATA) render(view());
}
loadStatus().then(loadWeather);
setInterval(loadStatus, 30000);
setInterval(loadWeather, 600000);
setInterval(() => DATA && render(view()), 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadStatus(); });
</script>
<script>
const COLORS = ['#ff6b6b','#f7b538','#4ecdc4','#a06cd5','#ff8fab','#3a86ff','#06d6a0','#fb5607'];
const col = n => COLORS[[...n].reduce((a,c)=>a+c.charCodeAt(0),0) % COLORS.length];
function render(v){
  let rows = '';
  for (const it of v.items) {
    if (it.type === 'fuel') { rows += `<div class="fuel">⛽ Fuel stop ${fmt(it.from)} to ${fmt(it.to)}</div>`; continue; }
    const cls = it.s === 'meet' ? 'white meetnow' : it.s === 'air' ? 'frost air' : 'frost';
    rows += `<div class="ld ${it.s==='done'?'done':''}">
      <div class="r"><div><div class="meet">Meet at the beach ${fmt(it.meet)}</div><div class="tk">Load ${it.n} · Takeoff ${fmt(it.time)}</div></div>
      <span class="p ${cls}">${esc(it.label)}</span></div>
      <div class="av">${it.people.map(p=>`<span style="background:${col(p)}">${esc(p[0])}</span>`).join('')}<em>${it.people.map(esc).join(', ')}</em></div></div>`;
  }
  const w = v.wx;
  document.getElementById('app').innerHTML = `
    <div class="bar"><div class="logo">🚁</div><span class="p frost live">Live</span></div>
    <div class="head"><div class="eyebrow">Brazil Boogie</div><h1>Live manifest</h1></div>
    <div class="glass stat"><div class="lab">Status</div>
      <div class="big"><span class="pulse ${v.st}"></span>${esc(v.headline)}</div>
      ${v.note?`<div class="note">${esc(v.note)}</div>`:''}<div class="u">${v.updated}</div></div>
    <h2>Today's loads</h2>
    ${rows}
    <h2>Meeting point</h2><div class="sub">Restaurante Mergulhador, Praia Tucuns</div>
    <div class="glass"><iframe src="${v.map}" loading="lazy"></iframe>
      <div class="in"><div><b>📍 On the beach</b><span>Same spot every day</span></div><a class="p white" href="${v.meet}" target="_blank" rel="noopener">Directions</a></div></div>
    ${w?`<h2>Weather</h2><div class="sub">Live forecast for Búzios</div>
    <div class="glass"><div class="wx"><div><b>${w.wind}</b><span>Wind kn ${w.dir}</span></div><div><b>${w.gust}</b><span>Gusts kn</span></div><div><b>${w.temp}°</b><span>${w.cloud}% Cloud</span></div></div>
      <div class="hrs">${w.hours.map(h=>`<div><i>${h.h}</i>${h.wind}/${h.gust}<i>${h.rain}% rain</i></div>`).join('')}</div></div>`:''}`;
}
</script></body></html>
